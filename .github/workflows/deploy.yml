name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wedding-invitation-cinematic-wr6ii7]
  workflow_dispatch:

# GITHUB_TOKEN needs to publish the Pages artifact and mint the deploy's OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo (source: GitHub Actions) if it isn't
          # already, so the first deploy needs no manual settings change.
          enablement: true

      - run: npm ci

      - name: Build static export
        # A project page is served from /<repo>/, so the whole site needs that
        # prefix baked in at build time.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
