<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <!-- PLACEHOLDER — Layer 2 (midground). Replace with a background-removed PNG
       cutout of the couple, shot with a long lens and rim lighting. Transparent
       background is essential: this layer must float between the venue and the
       foreground flowers. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a75"/>
      <stop offset="100%" stop-color="#080f2a"/>
    </linearGradient>
    <linearGradient id="clothWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a2e"/>
      <stop offset="100%" stop-color="#20122a"/>
    </linearGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6e3ba" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f6e3ba" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f2c877" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f2c877" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <g filter="url(#soft)">
    <!-- Groom -->
    <g>
      <path d="M470 1400c0-260 20-430 55-520 22-56 62-86 105-86s83 30 105 86c35 90 55 260 55 520z" fill="url(#cloth)"/>
      <path d="M545 700c0-40 35-64 85-64s85 24 85 64c0 30-20 52-85 52s-85-22-85-52z" fill="url(#cloth)"/>
      <circle cx="630" cy="612" r="62" fill="#101a3d"/>
      <!-- turban -->
      <path d="M556 596c6-64 40-100 74-100s68 36 74 100c-24-26-52-38-74-38s-50 12-74 38z" fill="#26356e"/>
      <path d="M556 596c26-18 48-26 74-26s48 8 74 26" fill="none" stroke="#e8b24c" stroke-width="3" stroke-opacity="0.65"/>
      <circle cx="630" cy="536" r="9" fill="#f2c877" opacity="0.85"/>
      <!-- stole -->
      <path d="M596 700c-6 180-4 340 8 480h20c-10-142-12-302-6-480z" fill="#c8952f" opacity="0.4"/>
      <path d="M470 1400c0-260 20-430 55-520" fill="none" stroke="url(#rimL)" stroke-width="6"/>
    </g>

    <!-- Bride -->
    <g>
      <path d="M330 1400c0-300 34-500 84-596 26-50 60-76 96-76s70 26 96 76c50 96 84 296 84 596z" fill="url(#clothWarm)" transform="translate(-40 0)"/>
      <circle cx="470" cy="640" r="58" fill="#1a1130"/>
      <!-- dupatta -->
      <path d="M470 566c-70 0-112 52-118 128-8 96 6 208 24 316l-34 8c-26-136-40-256-30-360 10-104 66-160 158-160s148 56 158 160c10 104-4 224-30 360l-34-8c18-108 32-220 24-316-6-76-48-128-118-128z" fill="#4a2340" opacity="0.9"/>
      <!-- maang tikka + jewellery -->
      <circle cx="470" cy="596" r="7" fill="#f6e3ba" opacity="0.9"/>
      <path d="M446 700h48" stroke="#f2c877" stroke-width="4" stroke-opacity="0.7"/>
      <path d="M624 1400c0-300-34-500-84-596" fill="none" stroke="url(#rimR)" stroke-width="6" transform="translate(-40 0)"/>
    </g>

    <!-- Held hands, the quiet centre of the frame -->
    <path d="M520 900c24 14 48 14 72 0" fill="none" stroke="#f6e3ba" stroke-width="7" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>
</svg>
